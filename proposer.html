<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF1D0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#251B34" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>Proposer un événement – Les P’tits Programmes</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="./">Les P’tits Programmes</a>
    <div id="who" hidden><span id="name"></span> <a class="chip" id="adm" href="admin.html" hidden>Page admin</a> <button class="chip" id="out" type="button">Se déconnecter</button></div>
  </header>
  <main>
    <section class="hero">
      <h1>Proposer un événement</h1>
      <p class="sub">Chaque proposition est relue avant publication. Les propositions de comptes fiables sont traitées en premier.</p>
    </section>
    <section id="login" class="panel" hidden>
      <p>Connectez-vous avec votre compte Google pour continuer.</p>
      <button class="btn" id="go" type="button">Continuer avec Google</button>
      <p class="note" id="err" aria-live="polite"></p>
    </section>
    <section id="app" hidden>
      <form id="f" class="panel form">
        <label class="full">Titre *<input name="title" required minlength="3" maxlength="139"></label>
        <label>Date *<input type="date" name="date" id="date" required></label>
        <label>Début *<input type="time" name="time" required></label>
        <label>Fin<input type="time" name="endTime"></label>
        <label>Ville *<input name="city" required></label>
        <label>Lieu<input name="place" placeholder="Médiathèque, salle des fêtes…"></label>
        <label>Type<select name="type"><option value="">—</option><option value="atelier">Atelier</option><option value="spectacle">Spectacle</option><option value="nature">Sortie nature</option><option value="eveil">Éveil et contes</option><option value="loisirs">Loisirs</option></select></label>
        <label class="full">Adresse<input name="address" placeholder="12 rue des Lilas" autocomplete="street-address"></label>
        <label class="full">Zone *<select name="zone" id="zone" required></select></label>
        <label>Âge min<input type="number" name="ageMin" min="0" max="17" inputmode="numeric"></label>
        <label>Âge max<input type="number" name="ageMax" min="0" max="17" inputmode="numeric"></label>
        <label>Prix (0 = gratuit)<input type="number" name="price" min="0" step="0.5" inputmode="decimal"></label>
        <label>Fréquence<select name="repeat"><option value="">Une seule fois</option><option value="weekly">Toutes les semaines (même jour)</option><option value="biweekly">Toutes les 2 semaines</option></select></label>
        <label class="full">Répéter jusqu’au (si fréquence)<input type="date" name="until"></label>
        <label class="full">Lien de l’annonce<input type="url" name="sourceUrl" placeholder="https://…"></label>
        <label class="full">Où avez-vous trouvé l’info ?<input name="sourceName"></label>
        <div class="full"><button class="btn" id="send" type="submit">Envoyer ma proposition</button> <button class="chip" id="cancel" type="button" hidden>Annuler</button><p class="note" id="msg" aria-live="polite"></p></div>
      </form>
      <h2 class="day">Mes propositions</h2>
      <div id="mine"></div>
    </section>
  </main>
</div>
<script type="module" src="js/proposer.js"></script>
</body>
</html>
